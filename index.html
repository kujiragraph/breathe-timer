<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<meta name="apple-mobile-web-app-title" content="Breathe Timer">
<title>Breathe Timer</title>
<style>
:root{--bg:#f6f8fa;--card:#fff;--text:#202832;--muted:#73808d;--line:#dfe5ea;--main:#5e7485;--soft:#e9eef2;--danger:#b14c4c}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif}body{min-height:100vh}
#app{max-width:680px;min-height:100vh;margin:auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 26px)}
header,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}header{margin-bottom:14px}h1{font-size:22px;margin:0}h2{font-size:18px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 8px 24px rgba(35,48,60,.07)}
.btn{border:0;border-radius:13px;padding:11px 15px;background:var(--main);color:#fff;font-weight:750;font-size:15px;touch-action:manipulation}.btn.secondary{background:var(--soft);color:var(--text)}.btn.danger{background:#fff0f0;color:var(--danger);border:1px solid #efcaca}.btn.small{padding:8px 10px}.btn.icon{width:38px;height:38px;padding:0}.btn:disabled{opacity:.4}.full{width:100%}
.label,.muted{color:var(--muted);font-size:12px}.name{font-weight:800}.meta{color:var(--muted);font-size:13px;margin-top:4px}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:var(--text)}
.breath{display:grid;grid-template-columns:1fr auto 56px auto;gap:8px;align-items:center}.breath b{font-size:14px}.num{text-align:center;font-weight:800}
.exercise{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.exercise:last-child{border:0}.move{display:flex;flex-direction:column;gap:4px}.exbody{display:flex;flex-direction:column;gap:7px}.sets{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.setlabel{min-width:72px;text-align:center;font-weight:800}.extime{font-size:12px;color:var(--muted)}
.total{position:sticky;bottom:8px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 8px 24px rgba(35,48,60,.09)}.total strong{font-size:21px;font-variant-numeric:tabular-nums}
.workout{min-height:calc(100vh - 45px);display:flex;flex-direction:column;text-align:center}.exerciseName{font-size:25px;font-weight:900;margin:12px 0 6px}.setCount{color:var(--muted);font-weight:750}.center{flex:1;min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center}.phase{font-size:24px;font-weight:900;letter-spacing:.12em;color:var(--main)}.count{font-size:106px;font-weight:850;line-height:1;margin:18px 0;font-variant-numeric:tabular-nums}.remain{color:var(--muted);font-size:14px}.next{border-top:1px solid var(--line);padding:14px 0}.next b{display:block;margin-top:4px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.pauseDots{font-size:44px;color:var(--muted)}
.complete{text-align:center;padding:48px 18px}.complete .tick{font-size:62px}.complete .time{font-size:34px;font-weight:900;margin:18px}.note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:12px}
</style>
</head>
<body><div id="app"></div><video id="noSleepVideo" playsinline muted loop style="position:fixed;width:1px;height:1px;opacity:.01;pointer-events:none;left:-10px;bottom:-10px" src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAMQbW9vdgAAAGxtdmhkAAAAAAAAAAAAAAAAAAAD6AAAA+gAAQAAAQAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAjt0cmFrAAAAXHRraGQAAAADAAAAAAAAAAAAAAABAAAAAAAAA+gAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAIAAAACAAAAAAAkZWR0cwAAABxlbHN0AAAAAAAAAAEAAAPoAAAAAAABAAAAAAGzbWRpYQAAACBtZGhkAAAAAAAAAAAAAAAAAABAAAAAQABVxAAAAAAALWhkbHIAAAAAAAAAAHZpZGUAAAAAAAAAAAAAAABWaWRlb0hhbmRsZXIAAAABXm1pbmYAAAAUdm1oZAAAAAEAAAAAAAAAAAAAACRkaW5mAAAAHGRyZWYAAAAAAAAAAQAAAAx1cmwgAAAAAQAAAR5zdGJsAAAAunN0c2QAAAAAAAAAAQAAAKphdmMxAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAAIAAgBIAAAASAAAAAAAAAABFUxhdmM2MS4xOS4xMDEgbGlieDI2NAAAAAAAAAAAAAAAGP//AAAAMGF2Y0MBQsAe/+EAGGdCwB7ZH4iIwEQAAAMABAAAAwAIPFi5IAEABWjLg8sgAAAAEHBhc3AAAAABAAAAAQAAABRidHJ0AAAAAAAAFDAAAAAAAAAAGHN0dHMAAAAAAAAAAQAAAAEAAEAAAAAAHHN0c2MAAAAAAAAAAQAAAAEAAAABAAAAAQAAABRzdHN6AAAAAAAAAoYAAAABAAAAFHN0Y28AAAAAAAAAAQAAA0AAAABhdWR0YQAAAFltZXRhAAAAAAAAACFoZGxyAAAAAAAAAABtZGlyYXBwbAAAAAAAAAAAAAAAACxpbHN0AAAAJKl0b28AAAAcZGF0YQAAAAEAAAAATGF2ZjYxLjcuMTAzAAAACGZyZWUAAAKObWRhdAAAAnAGBf//bNxF6b3m2Ui3lizYINkj7u94MjY0IC0gY29yZSAxNjQgcjMxMDggMzFlMTlmOSAtIEguMjY0L01QRUctNCBBVkMgY29kZWMgLSBDb3B5bGVmdCAyMDAzLTIwMjMgLSBodHRwOi8vd3d3LnZpZGVvbGFuLm9yZy94MjY0Lmh0bWwgLSBvcHRpb25zOiBjYWJhYz0wIHJlZj0zIGRlYmxvY2s9MTowOjAgYW5hbHlzZT0weDE6MHgxMTEgbWU9aGV4IHN1Ym1lPTcgcHN5PTEgcHN5X3JkPTEuMDA6MC4wMCBtaXhlZF9yZWY9MSBtZV9yYW5nZT0xNiBjaHJvbWFfbWU9MSB0cmVsbGlzPTEgOHg4ZGN0PTAgY3FtPTAgZGVhZHpvbmU9MjEsMTEgZmFzdF9wc2tpcD0xIGNocm9tYV9xcF9vZmZzZXQ9LTIgdGhyZWFkcz0xIGxvb2thaGVhZF90aHJlYWRzPTEgc2xpY2VkX3RocmVhZHM9MCBucj0wIGRlY2ltYXRlPTEgaW50ZXJsYWNlZD0wIGJsdXJheV9jb21wYXQ9MCBjb25zdHJhaW5lZF9pbnRyYT0wIGJmcmFtZXM9MCB3ZWlnaHRwPTAga2V5aW50PTI1MCBrZXlpbnRfbWluPTEgc2NlbmVjdXQ9NDAgaW50cmFfcmV <script>
(()=>{
const KEY="breatheTimerMenus_v1",TRANSITION=5,START_COUNTDOWN=5;
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+"_"+Math.random()}
const sample={id:uid(),name:"30min Full Body",breath:{inhale:5,ip:1,exhale:7,ep:1},exercises:[
{name:"Standing Roll Down",sets:8},{name:"Shoulder Bridge",sets:10},{name:"Bridge Ball Press",sets:8},{name:"Double Leg Stretch",sets:8},{name:"Single Leg Stretch",sets:8},{name:"Roll Up",sets:10},{name:"Side Kick R",sets:8},{name:"Side Kick L",sets:8},{name:"Swan",sets:8},{name:"Swimming",sets:10},{name:"Leg Pull Front Hold",sets:5},{name:"Leg Pull Front",sets:10},{name:"Push Up",sets:10},{name:"Standing Roll Down",sets:14}]};
let menus=load(),screen="home",edit=null,w=null,timer=null,nextTick=0,audio=null,wake=null;
function load(){try{const x=localStorage.getItem(KEY);if(x){const p=JSON.parse(x);if(Array.isArray(p))return p}}catch(e){}return [sample]}
function persist(){localStorage.setItem(KEY,JSON.stringify(menus))}
function clone(x){return JSON.parse(JSON.stringify(x))}
function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function cycle(b){return Math.max(1,+b.inhale)+Math.max(0,+b.ip)+Math.max(1,+b.exhale)+Math.max(0,+b.ep)}
function exSecs(m,e){return Math.max(0,+e.sets)*cycle(m.breath)-Math.max(0,+m.breath.ep)}
function activeExercises(m){return m.exercises.filter(e=>e.name.trim()&&+e.sets>0)}
function totalSecs(m){const a=activeExercises(m);return a.reduce((s,e)=>s+exSecs(m,e),0)+Math.max(0,a.length-1)*TRANSITION}
function totalSets(m){return m.exercises.reduce((s,e)=>s+Math.max(0,+e.sets||0),0)}
function node(s){const t=document.createElement("template");t.innerHTML=s.trim();return t.content.firstElementChild}
function render(){const a=document.getElementById("app");a.innerHTML="";({home,edit:editScreen,workout,complete})[screen](a)}
function home(a){a.append(node('<header><div><h1>MY MENUS</h1><div class="muted">Breath Metronome Pilates Timer</div></div><button class="btn small" id="new">＋ NEW</button></header><div class="card"><div class="row"><div><div class="name">SOUND TEST</div><div class="meta">クリック音が聞こえるか確認</div></div><button class="btn secondary" id="soundTest">▶ TEST</button></div></div>'));menus.forEach((m,i)=>{const c=node('<div class="card"><div class="row"><div><div class="name title"></div><div class="meta info"></div></div><div class="meta setinfo"></div></div><div class="actions"><button class="btn start">START</button><button class="btn secondary ed">EDIT</button><button class="btn danger del">DELETE</button></div></div>');c.querySelector(".title").textContent=m.name;c.querySelector(".info").textContent=fmt(totalSecs(m))+" ・ Breath "+[m.breath.inhale,m.breath.ip,m.breath.exhale,m.breath.ep].join("-");c.querySelector(".setinfo").textContent=totalSets(m)+" SET";c.querySelector(".start").onclick=()=>start(m);c.querySelector(".ed").onclick=()=>{edit=clone(m);screen="edit";render()};c.querySelector(".del").onclick=()=>{if(confirm("このメニューを削除しますか？")){menus.splice(i,1);persist();render()}};a.append(c)});document.getElementById("new").onclick=()=>{edit={id:uid(),name:"New Menu",breath:{inhale:5,ip:1,exhale:7,ep:1},exercises:[{name:"",sets:8}]};screen="edit";render()};document.getElementById("soundTest").onclick=async()=>{await audioOn();lowClick();setTimeout(lowClick,500);setTimeout(lowClick,1000);setTimeout(lowClick,1500);setTimeout(highClick,2000)};a.append(node('<div class="note">メニューはこのiPhoneのSafari内に保存されます。SafariのWebサイトデータを削除すると保存内容も消えます。音はINHALE・EXHALE・開始カウントダウンで共通です。リズムは1秒ごとに一定で、各区間の最後のカウントだけ高い音になります。音が出ない場合は、iPhoneの消音モードをOFFにして音量も確認してください。ワークアウト中は画面ロック防止を自動で試みます。</div>'))}
function editScreen(a){a.append(node('<header><button class="btn secondary small" id="back">← BACK</button><h1>EDIT MENU</h1><div style="width:66px"></div></header>'));const nc=node('<div class="card"><div class="label">MENU NAME</div><input id="menuName"></div>');nc.querySelector("input").value=edit.name;nc.querySelector("input").oninput=e=>edit.name=e.target.value;a.append(nc);const bc=node('<div class="card"><div class="row"><h2>BREATH</h2><div class="muted">1 SET = <b id="cy"></b> SEC</div></div><div class="breath" id="bg" style="margin-top:12px"></div></div>');a.append(bc);bc.querySelector("#cy").textContent=cycle(edit.breath);[["INHALE","inhale"],["PAUSE","ip"],["EXHALE","exhale"],["PAUSE","ep"]].forEach(([lab,key])=>{const n=node("<b>"+lab+"</b>"),mi=node('<button class="btn secondary icon">−</button>'),nu=node('<div class="num">'+edit.breath[key]+'秒</div>'),pl=node('<button class="btn secondary icon">＋</button>');mi.onclick=()=>{const min=(key==="inhale"||key==="exhale")?1:0;edit.breath[key]=Math.max(min,edit.breath[key]-1);render()};pl.onclick=()=>{edit.breath[key]=Math.min(30,edit.breath[key]+1);render()};bc.querySelector("#bg").append(n,mi,nu,pl)});const lc=node('<div class="card"><div class="row"><h2>EXERCISES</h2><button class="btn secondary small" id="add">＋ ADD</button></div><div id="list"></div></div>');a.append(lc);edit.exercises.forEach((e,i)=>{const r=node('<div class="exercise"><div class="move"><button class="btn secondary icon up">↑</button><button class="btn secondary icon down">↓</button></div><div class="exbody"><input class="ename" placeholder="種目名"><div class="sets"><button class="btn secondary icon minus">−</button><div class="setlabel"><span></span> SET</div><button class="btn secondary icon plus">＋</button><div class="extime"></div></div></div><button class="btn danger icon del">×</button></div>');r.querySelector(".ename").value=e.name;r.querySelector(".ename").oninput=x=>e.name=x.target.value;r.querySelector(".setlabel span").textContent=e.sets;r.querySelector(".extime").textContent=fmt(exSecs(edit,e));r.querySelector(".minus").onclick=()=>{e.sets=Math.max(1,e.sets-1);render()};r.querySelector(".plus").onclick=()=>{e.sets=Math.min(999,e.sets+1);render()};r.querySelector(".del").onclick=()=>{edit.exercises.splice(i,1);render()};r.querySelector(".up").disabled=i===0;r.querySelector(".down").disabled=i===edit.exercises.length-1;r.querySelector(".up").onclick=()=>{[edit.exercises[i-1],edit.exercises[i]]=[edit.exercises[i],edit.exercises[i-1]];render()};r.querySelector(".down").onclick=()=>{[edit.exercises[i+1],edit.exercises[i]]=[edit.exercises[i],edit.exercises[i+1]];render()};lc.querySelector("#list").append(r)});lc.querySelector("#add").onclick=()=>{edit.exercises.push({name:"",sets:8});render()};const total=node('<div class="total row"><div><div class="label">TOTAL</div><strong id="tt"></strong></div><div class="actions" style="margin:0"><button class="btn secondary" id="save">SAVE</button><button class="btn" id="go">START</button></div></div>');total.querySelector("#tt").textContent=fmt(totalSecs(edit));a.append(total);document.getElementById("back").onclick=()=>{screen="home";edit=null;render()};document.getElementById("save").onclick=()=>saveEdit(true);document.getElementById("go").onclick=()=>{if(saveEdit(false))start(edit)}}
function valid(){if(!edit.name.trim()){alert("メニュー名を入力してください。");return false}edit.exercises=edit.exercises.filter(e=>e.name.trim()&&+e.sets>0);if(!edit.exercises.length){alert("種目を1つ以上入力してください。");return false}return true}
function saveEdit(goHome){if(!valid())return false;const i=menus.findIndex(m=>m.id===edit.id);if(i>=0)menus[i]=clone(edit);else menus.push(clone(edit));persist();if(goHome){screen="home";edit=null;render()}return true}
async function audioOn(){if(!audio){const AC=window.AudioContext||window.webkitAudioContext;audio=new AC()}if(audio.state==="suspended")await audio.resume()}
function tone(f,d=.075,g=.16,type="square",delay=0){if(!audio)return;const t=audio.currentTime+delay,o=audio.createOscillator(),v=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.004);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(audio.destination);o.start(t);o.stop(t+d+.015)}
function lowClick(){tone(520,.095,.20,"sine")}
function highClick(){tone(980,.11,.22,"sine")}
function countdownClick(isLast=false){isLast?highClick():lowClick()}
function breathClick(isLast=false){isLast?highClick():lowClick()}
function exerciseDone(){tone(820,.12,.22,"sine");tone(1120,.16,.24,"sine",.14)}function workoutDone(){tone(620,.12,.22,"sine");tone(860,.14,.24,"sine",.16);tone(1260,.24,.27,"sine",.34)}
async function keepAwake(){
  let locked=false;
  try{
    if("wakeLock" in navigator){
      if(!wake || wake.released){
        wake=await navigator.wakeLock.request("screen");
        if(wake && wake.addEventListener){
          wake.addEventListener("release",()=>{
            wake=null;
            if(w && !w.paused && screen==="workout" && document.visibilityState==="visible"){
              setTimeout(()=>keepAwake(),250);
            }
          });
        }
      }
      locked=!!wake && !wake.released;
    }
  }catch(e){locked=false}
  if(!locked){
    try{
      const v=document.getElementById("noSleepVideo");
      if(v && v.src){
        v.currentTime=0;
        await v.play();
      }
    }catch(e){}
  }
}
async function allowSleep(){
  try{if(wake){await wake.release();wake=null}}catch(e){}
  try{
    const v=document.getElementById("noSleepVideo");
    if(v){v.pause();v.currentTime=0}
  }catch(e){}
}
async function start(m){await audioOn();const active=activeExercises(m);w={menu:clone({...m,exercises:active}),ei:0,set:1,phase:"start",sec:0,startCount:START_COUNTDOWN,remaining:exSecs(m,active[0]),transition:TRANSITION,paused:false};screen="workout";render();countdownClick(false);keepAwake();schedule()}
function clearTimer(){if(timer){clearTimeout(timer);timer=null}}function schedule(){clearTimer();nextTick=performance.now()+1000;const loop=()=>{const delay=Math.max(0,nextTick-performance.now());timer=setTimeout(()=>{tick();nextTick+=1000;if(w&&!w.paused&&screen==="workout")loop()},delay)};loop()}
function phaseDuration(){const b=w.menu.breath;return w.phase==="inhale"?b.inhale:w.phase==="ip"?b.ip:w.phase==="exhale"?b.exhale:w.phase==="ep"?b.ep:0}
function tick(){if(w && !w.paused && screen==="workout" && ((w._wakeCheck=(w._wakeCheck||0)+1)%15===0))keepAwake();if(w.phase==="start"){w.startCount--;if(w.startCount<=0){beginExercise()}else{countdownClick(w.startCount===1)}render();return}if(w.phase==="transition"){w.transition--;if(w.transition<=0)beginExercise();render();return}w.remaining=Math.max(0,w.remaining-1);if(w.sec<phaseDuration()){w.sec++;if(w.phase==="inhale"||w.phase==="exhale")breathClick(w.sec===phaseDuration())}else advance();render()}
function advance(){const b=w.menu.breath;if(w.phase==="inhale"){if(b.ip>0){w.phase="ip";w.sec=1}else{w.phase="exhale";w.sec=1;breathClick(false)}return}if(w.phase==="ip"){w.phase="exhale";w.sec=1;breathClick(false);return}if(w.phase==="exhale"){const e=w.menu.exercises[w.ei];if(w.set>=e.sets){finishExercise()}else if(b.ep>0){w.phase="ep";w.sec=1}else{w.set++;w.phase="inhale";w.sec=1;breathClick(false)}return}if(w.phase==="ep"){w.set++;w.phase="inhale";w.sec=1;breathClick(false)}}
function finishExercise(){if(w.ei>=w.menu.exercises.length-1){workoutDone();clearTimer();allowSleep();screen="complete";setTimeout(render,420)}else{exerciseDone();w.ei++;w.phase="transition";w.transition=TRANSITION;w.sec=0}}
function beginExercise(){w.set=1;w.phase="inhale";w.sec=1;w.remaining=exSecs(w.menu,w.menu.exercises[w.ei]);breathClick(false)}
function workout(a){const e=w.menu.exercises[w.ei],n=w.menu.exercises[w.ei+1];if(w.phase==="start"){const x=node('<div class="workout"><div class="center"><div class="label">STARTING</div><div class="exerciseName nn"></div><div class="count sc"></div><div class="muted">準備してください</div></div><div class="controls"><button class="btn secondary" id="pause"></button><button class="btn danger" id="end">END</button></div></div>');x.querySelector(".nn").textContent=e.name;x.querySelector(".sc").textContent=w.startCount;a.append(x)}else if(w.phase==="transition"){const x=node('<div class="workout"><div class="center"><div class="label">NEXT</div><div class="exerciseName nn"></div><div class="count tc"></div></div><div class="controls"><button class="btn secondary" id="pause"></button><button class="btn danger" id="end">END</button></div></div>');x.querySelector(".nn").textContent=e.name;x.querySelector(".tc").textContent=w.transition;a.append(x)}else{const p=w.phase==="inhale"?"INHALE":w.phase==="exhale"?"EXHALE":"PAUSE",c=(w.phase==="ip"||w.phase==="ep")?"":w.sec;const x=node('<div class="workout"><div><div class="exerciseName en"></div><div class="setCount">SET <span class="sn"></span> / <span class="st"></span></div></div><div class="center"><div class="phase ph"></div><div class="count co"></div><div class="remain">残り <span class="rm"></span></div></div><div class="next"><div class="label">NEXT</div><b class="nx"></b></div><div class="controls"><button class="btn secondary" id="pause"></button><button class="btn danger" id="end">END</button></div></div>');x.querySelector(".en").textContent=e.name;x.querySelector(".sn").textContent=w.set;x.querySelector(".st").textContent=e.sets;x.querySelector(".ph").textContent=p;x.querySelector(".co").innerHTML=c===""?'<div class="pauseDots">•••</div>':c;x.querySelector(".rm").textContent=fmt(w.remaining);x.querySelector(".nx").textContent=n?n.name:"COMPLETE";a.append(x)}document.getElementById("pause").textContent=w.paused?"RESUME":"PAUSE";document.getElementById("pause").onclick=async()=>{w.paused=!w.paused;if(w.paused){clearTimer();await allowSleep()}else{await audioOn();await keepAwake();schedule()}render()};document.getElementById("end").onclick=()=>{if(confirm("ワークアウトを終了しますか？")){clearTimer();allowSleep();w=null;screen="home";render()}}}
function complete(a){const m=w.menu,x=node('<div class="card complete"><div class="tick">✓</div><h1>COMPLETE</h1><div class="name mn"></div><div class="time tm"></div><div class="meta ss"></div><div style="margin-top:22px"><button class="btn full" id="done">END</button></div></div>');x.querySelector(".mn").textContent=m.name;x.querySelector(".tm").textContent=fmt(totalSecs(m));x.querySelector(".ss").textContent=totalSets(m)+" SET";a.append(x);document.getElementById("done").onclick=()=>{w=null;screen="home";render()}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&w&&!w.paused&&screen==="workout")keepAwake()});render();
})();
</script>
</body>
</html>
